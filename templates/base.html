{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PayTogether{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧳</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Plus Jakarta Sans", "ui-sans-serif", "system-ui", "sans-serif"],
                    },
                    colors: {
                        brand: {
                            50: "#f2f2ff",
                            100: "#e6e6ff",
                            200: "#c7c6ff",
                            300: "#a3a0fd",
                            400: "#8b7bf7",
                            500: "#7358ef",
                            600: "#6440dd",
                            700: "#5432b8",
                            800: "#452b93",
                            900: "#3a2777",
                        },
                        accent: {
                            500: "#14b8a6",
                            600: "#0d9488",
                        },
                    },
                    boxShadow: {
                        soft: "0 2px 10px -2px rgba(24, 20, 60, 0.08), 0 8px 30px -8px rgba(24, 20, 60, 0.10)",
                        card: "0 1px 2px rgba(24,20,60,0.04), 0 8px 24px -8px rgba(24,20,60,0.10)",
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d9d6ff; border-radius: 9999px; }
        .bg-brand-gradient { background: linear-gradient(135deg, #6440dd 0%, #7358ef 45%, #14b8a6 100%); }
        .text-gradient {
            background: linear-gradient(135deg, #6440dd, #14b8a6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .skeleton {
            background: linear-gradient(90deg, #eef0f6 25%, #f8f9fc 37%, #eef0f6 63%);
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

    {% block content %}{% endblock %}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.lucide) { lucide.createIcons(); }
        });
    </script>

    {% block scripts %}{% endblock %}

</body>

</html>
